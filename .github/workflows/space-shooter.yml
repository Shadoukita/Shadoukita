# ◆ arena — turns the contribution graph into a playable-looking space shooter
#   https://github.com/czl9707/gh-space-shooter
name: arena · space shooter

on:
  schedule:
    - cron: "17 3 * * *"   # daily at 03:17 UTC
  workflow_dispatch:        # run it once by hand after setup

permissions:
  contents: write

jobs:
  arena:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2    # needed: the action amends its own previous commit instead of piling up new ones

      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: assets/space-shooter.webp
          strategy: random
          fps: 30
          commit-message: "arena: respawn space shooter"
