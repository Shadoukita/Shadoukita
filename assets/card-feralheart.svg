<svg xmlns="http://www.w3.org/2000/svg" width="900" height="262" viewBox="0 0 900 262" role="img" aria-labelledby="t d" font-size="13" fill="#c9d1d9" xml:space="preserve"><title id="t">FeralHeart - project card</title><desc id="d">FeralHeart - modernizing the 2011 C++ codebase: OGRE 1.7 to 14.5, x64, OpenGL, new water, sky, soft shadows, bloom and Argon2id authentication.</desc><style>@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;white-space:pre}.ap{animation:ap .01s linear both}@keyframes ap{from{opacity:0}to{opacity:1}}.vis{opacity:0;animation:vis 1s linear}@keyframes vis{from,to{opacity:1}}.tw{transform-box:fill-box;transform-origin:100% 50%;transform:scaleX(0)}@keyframes tw{from{transform:scaleX(1)}to{transform:scaleX(0)}}.blink{animation:blink 1.1s steps(1,end) infinite}@keyframes blink{50%{opacity:0}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes clip2r{from{transform:translateY(0)}to{transform:translateY(274px)}}</style><defs><filter id="sh" x="-4%" y="-6%" width="108%" height="118%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".35"/></filter><pattern id="scan1" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".22"/></pattern><clipPath id="clip2"><rect x="437" y="51" width="438" height="184" rx="8"/></clipPath><linearGradient id="clip2g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".045"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect x="8" y="6" width="884" height="248" rx="10" fill="#0b0f14" filter="url(#sh)"/><path d="M8 16a10 10 0 0 1 10 -10h864a10 10 0 0 1 10 10v24h-884z" fill="#10161d"/><path d="M8 40h884" stroke="#1f2833"/><rect x="8.5" y="6.5" width="883" height="247" rx="10" fill="none" stroke="#1f2833"/><circle cx="26" cy="23" r="5.5" fill="#ff5f57" opacity=".85"/><circle cx="44" cy="23" r="5.5" fill="#febc2e" opacity=".85"/><circle cx="62" cy="23" r="5.5" fill="#28c840" opacity=".85"/><text x="450" y="27" font-size="12" fill="#6e7681" text-anchor="middle" textLength="259.2">shadou@github: ~/projects/feralheart</text><text x="876" y="27" font-size="11" fill="#6e7681" text-anchor="end" textLength="224.4">github.com/Shadoukita/FeralHeart ↗</text><text x="32" y="66" font-size="11" font-weight="700" fill="#c6ff00" letter-spacing="1.2">◆ ENGINE MODERNIZATION</text><text x="32" y="104" font-size="34" font-weight="800" fill="#c9d1d9" textLength="102">Feral</text><text x="134" y="104" font-size="34" font-weight="800" fill="#ff3860" textLength="102">Heart</text><text x="32" y="134" fill="#c9d1d9" opacity="0.86" textLength="319.8">KovuLKD's 2011 3D online multiplayer RPG:</text><text x="32" y="153" fill="#c9d1d9" opacity="0.86" textLength="319.8">full C++ client + 3-process server stack,</text><text x="32" y="172" fill="#c9d1d9" opacity="0.86" textLength="218.4">dragged into the modern era.</text><rect x="32.5" y="197.5" width="32.8" height="19" rx="10" fill="#c6ff00" fill-opacity=".08" stroke="#c6ff00" stroke-opacity=".55"/><text x="39" y="210.96" font-size="11" fill="#c6ff00" textLength="19.8">C++</text><rect x="72.3" y="197.5" width="59.2" height="19" rx="10" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".55"/><text x="78.8" y="210.96" font-size="11" fill="#22d3ee" textLength="46.2">OGRE 14</text><rect x="138.5" y="197.5" width="52.6" height="19" rx="10" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-opacity=".55"/><text x="145" y="210.96" font-size="11" fill="#a78bfa" textLength="39.6">OpenGL</text><rect x="198.1" y="197.5" width="46" height="19" rx="10" fill="#ffb020" fill-opacity=".08" stroke="#ffb020" stroke-opacity=".55"/><text x="204.6" y="210.96" font-size="11" fill="#ffb020" textLength="33">MySQL</text><rect x="251.1" y="197.5" width="65.8" height="19" rx="10" fill="#ff3860" fill-opacity=".08" stroke="#ff3860" stroke-opacity=".55"/><text x="257.6" y="210.96" font-size="11" fill="#ff3860" textLength="52.8">Argon2id</text><circle cx="37" cy="228" r="5" fill="#f34b7d"/><text x="48" y="232" font-size="12" fill="#c9d1d9" textLength="21.6">C++</text><text x="84" y="232" font-size="12" fill="#6e7681">·</text><text x="105.6" y="232" font-size="12" fill="#6e7681" textLength="79.2">view source</text><text x="192" y="232" font-size="12" font-weight="700" fill="#c6ff00">→</text><rect x="436" y="50" width="440" height="186" rx="8" fill="#070a0e" stroke="#1f2833"/><g class="ap" style="animation-delay:0.50s"><text x="452" y="74" font-size="12" fill="#ff3860" opacity="0.55" textLength="216">--- a/FeralHeart (2011 client)</text></g><g class="ap" style="animation-delay:0.68s"><text x="452" y="92" font-size="12" fill="#c6ff00" opacity="0.55" textLength="208.8">+++ b/FeralHeart (modernized)</text></g><g class="ap" style="animation-delay:0.86s"><rect x="442" y="97" width="420" height="18" fill="#2a0f16" opacity=".9"/></g><g class="ap" style="animation-delay:0.86s"><text x="452" y="110" font-size="12" fill="#ff3860" textLength="273.6">- OGRE 1.7.4 · VS2013 · x86 · Direct3D</text></g><g class="ap" style="animation-delay:1.04s"><rect x="442" y="115" width="420" height="18" fill="#0f2a12" opacity=".9"/></g><g class="ap" style="animation-delay:1.04s"><text x="452" y="128" font-size="12" fill="#c6ff00" textLength="288">+ OGRE 14.5.2 · VS2022 · x64 · OpenGL 3+</text></g><g class="ap" style="animation-delay:1.22s"><rect x="442" y="133" width="420" height="18" fill="#2a0f16" opacity=".9"/></g><g class="ap" style="animation-delay:1.22s"><text x="452" y="146" font-size="12" fill="#ff3860" textLength="295.2">- flat water plane · SkyX · MD5 passwords</text></g><g class="ap" style="animation-delay:1.40s"><rect x="442" y="151" width="420" height="18" fill="#0f2a12" opacity=".9"/></g><g class="ap" style="animation-delay:1.40s"><text x="452" y="164" font-size="12" fill="#c6ff00" textLength="280.8">+ simplex-noise water · synced sky dome</text></g><g class="ap" style="animation-delay:1.58s"><rect x="442" y="169" width="420" height="18" fill="#0f2a12" opacity=".9"/></g><g class="ap" style="animation-delay:1.58s"><text x="452" y="182" font-size="12" fill="#c6ff00" textLength="273.6">+ soft PCF shadows · 48 lights · bloom</text></g><g class="ap" style="animation-delay:1.76s"><rect x="442" y="187" width="420" height="18" fill="#0f2a12" opacity=".9"/></g><g class="ap" style="animation-delay:1.76s"><text x="452" y="200" font-size="12" fill="#c6ff00" textLength="295.2">+ SHA-256 on the client → Argon2id server</text></g><g clip-path="url(#clip2)" pointer-events="none"><rect x="437" y="51" width="438" height="184" fill="url(#scan1)"/><rect x="437" y="-39" width="438" height="90" fill="url(#clip2g)" style="animation:clip2r 7s linear infinite"/></g></svg>